<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trading Charts">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="logo-icon.png">
<link rel="icon" href="logo-icon.png">
<title>Trading Charts</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:#000}
#splash video{width:100%;height:100%;object-fit:cover;display:block}
#root{color:#e6e9ee;font:15px -apple-system,system-ui,sans-serif}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="splash">
  <video id="sv" src="logo-splash.mp4" muted playsinline autoplay preload="auto"></video>
</div>
<div id="root"></div>

<script async src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
/* Guscio fisso: apre il video e scarica app.js nuovo a ogni apertura.
   Tutto il resto (animazione, logo, login, grafico) sta in app.js. */
fetch('app.js?t='+Date.now(),{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('app.js '+r.status);return r.text()})
  .then(function(code){
    var s=document.createElement('script');
    s.textContent=code;
    document.body.appendChild(s);
  })
  .catch(function(e){
    var sp=document.getElementById('splash');if(sp)sp.remove();
    var r=document.getElementById('root');
    r.style.padding='24px';
    r.textContent='Impossibile caricare l\'app: '+e.message+'. Controlla la connessione e riapri.';
  });
</script>
</body>
</html>
